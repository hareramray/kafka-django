# Optional notebook 15 cluster. Keep it separate from the beginner stack:
# docker compose -p kafka-expert -f compose.cluster.yaml up -d --wait
x-kafka-common: &kafka-common
  image: apache/kafka:4.1.2
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 30s
  stop_grace_period: 20s

x-kafka-environment: &kafka-environment
  CLUSTER_ID: "Nmk3YTQ3YTctNDdjZi00Mg"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:9093,2@broker2:9093,3@broker3:9093"
  KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_REPLICA_LAG_TIME_MAX_MS: 10000
  KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"

services:
  broker1:
    <<: *kafka-common
    hostname: broker1
    ports:
      - "127.0.0.1:19092:9094"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker1:9092,EXTERNAL://localhost:19092"
    volumes:
      - broker1-data:/var/lib/kafka/data
  broker2:
    <<: *kafka-common
    hostname: broker2
    ports:
      - "127.0.0.1:29092:9094"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker2:9092,EXTERNAL://localhost:29092"
    volumes:
      - broker2-data:/var/lib/kafka/data
  broker3:
    <<: *kafka-common
    hostname: broker3
    ports:
      - "127.0.0.1:39092:9094"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker3:9092,EXTERNAL://localhost:39092"
    volumes:
      - broker3-data:/var/lib/kafka/data

volumes:
  broker1-data:
  broker2-data:
  broker3-data:
