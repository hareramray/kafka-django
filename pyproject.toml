[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-django-workshop"
version = "1.0.0"
description = "Hands-on Kafka with Python and Django: beginner to advanced notebooks"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.12,<3",
  "Django>=5.2,<5.3",
  "jupyterlab>=4.4,<5",
  "ipykernel>=6.29,<8",
  "python-dotenv>=1.1,<2",
  "jsonschema>=4.23,<5",
  "nbformat>=5.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "nbclient>=0.10,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["labtools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

